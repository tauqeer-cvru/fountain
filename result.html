<script>

let studentData = null;

let file="result.xlsx";

// number to words
function numToWords(num){
let ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
"Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
let tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

if(num<20) return ones[num];
if(num<100) return tens[Math.floor(num/10)]+" "+ones[num%10];
return num;
}

async function getResult(){

let roll=document.getElementById("roll").value.toUpperCase().trim();
let name=document.getElementById("name").value.toUpperCase().trim();

let res=await fetch(file);
let arrayBuffer=await res.arrayBuffer();
let workbook=XLSX.read(arrayBuffer,{type:"array"});

let student=null;


workbook.SheetNames.forEach(sheet=>{
let data=XLSX.utils.sheet_to_json(workbook.Sheets[sheet]);
data.forEach(row=>{
if((row["Roll No."]||"").toUpperCase()==roll &&
(row["Student Name (English)"]||"").toUpperCase()==name){
student=row;
studentData=row;

}
});
});

if(!student){
document.getElementById("resultBox").innerHTML="<h3 style='color:red'>❌ Result Not Found</h3>";
return;
}

// SUBJECT
let subjects=[];

if(student.Class=="11th"){
subjects=[
["Physics","Physics"],
["Chemistry","Chemistry"],
["Hindi","Hindi"],
["English","English"],
["Logical Reasoning","Logical Reasoning"]
];
}else{
subjects=[
["Science","Science"],
["Math","Math"],
["Social Science","Social Science"],
["Hindi","Hindi Marks"],
["English","English Marks"]
];
}


// CALC

let total=0;
let rows="";

subjects.forEach(s=>{
let m=Number(student[s[1]]||0);
total+=m;
let per=((m/20)*100).toFixed(1);
rows+=`<tr><td>${s[0]}</td><td>${m}</td><td>${per}%</td></tr>`;
});

let percent=total;



// SCHOLARSHIP
let scholarship=0;

if(percent<30) scholarship=0;
else if(percent<40) scholarship=10;
else if(percent<50) scholarship=20;
else if(percent<60) scholarship=30;
else if(percent<70) scholarship=40;
else if(percent<80) scholarship=50;
else scholarship=90;

// FEE
let actualFee=300;
if(student.Class=="9th") actualFee=500;
if(student.Class=="10th") actualFee=500;
if(student.Class=="11th") actualFee=1000;
if(student.Class=="12th") actualFee=1000;

let finalFee=Math.round(actualFee-(actualFee*scholarship/100));
let scholarshipTableFull = `
<h3 style="text-align:center;margin-top:15px;">🎯 छात्रवृत्ति योजना</h3>

<td>20%</td>
<td>30%</td>
<td>40%</td>
<td>50%</td>
<td>90%</td>
</tr>
</table>
`;

let finalMessage = `
<div class="result-box">
<center>
<h3>🎉 आपके परिणाम का विश्लेषण</h3>

<p>

आपको <b>${scholarship}% छात्रवृत्ति</b> मिली है।

`;
let finalMessage1 = `

<div class="admission-box">

<p>
📢 1 अप्रैल से नई कक्षाएं प्रारंभ हो रही हैं।<br><br>

// DOWNLOAD
async function downloadPDF() {

try{

const { jsPDF } = window.jspdf;

let element = document.getElementById("marksheet");

if(!element){
alert("❌ Marksheet not found");
return;
}

let canvas = await html2canvas(element, {
scale: 2,
useCORS: true
});

let imgData = canvas.toDataURL("image/png");

let pdf = new jsPDF("p", "mm", "a4");
let margin = 10;
let imgWidth = 210;
let imgHeight = (canvas.height * imgWidth) / canvas.width;

pdf.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);


// ✅ filename fix
let fileName = "Result.pdf";

if(studentData){
fileName = studentData["Student Name (English)"] + "_Result.pdf";
}

pdf.save(fileName);

}catch(err){
console.log(err);
alert("PDF download error");
}

}

// WHATSAPP
